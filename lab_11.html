
<!DOCTYPE html>
<html>
<head>
    <title>Header and Navbar</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>

    <!-- Header -->
    <header class="bg-[#800020] text-white p-4">

        <div class="flex justify-between items-center">

            <!-- Logo -->
            <h1 class="text-2xl font-bold">MyStore</h1>

            <!-- Navigation -->
            <nav class="flex gap-6">

                <a href="#" class="hover:text-pink-300 transition">
                    Home
                </a>

                <a href="#" class="hover:text-pink-300 transition">
                    About
                </a>

                <!-- Dropdown -->
                <div class="relative group">

                    <button class="hover:text-pink-300 transition">
                        Products
                    </button>

                    <div class="hidden group-hover:block absolute bg-white text-black p-2 w-32 shadow-lg rounded">

                        <a href="#" class="block p-2 hover:bg-[#f5e6eb] hover:text-[#800020]">
                            Laptop
                        </a>

                        <a href="#" class="block p-2 hover:bg-[#f5e6eb] hover:text-[#800020]">
                            Mobile
                        </a>

                        <a href="#" class="block p-2 hover:bg-[#f5e6eb] hover:text-[#800020]">
                            Shoes
                        </a>

                    </div>
                </div>

                <a href="#" class="hover:text-pink-300 transition">
                    Contact
                </a>

            </nav>

        </div>

    </header>

</body>
</html>
